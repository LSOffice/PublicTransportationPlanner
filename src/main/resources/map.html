<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Transport Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    /* ── Design tokens ───────────────────────────────────────── */
    :root {
      --bg: #ffffff;
      --bg-muted: #f8fafc;
      --bg-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: #93c5fd;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #1d4ed8;
      --accent-dark: #1e40af;
      --accent-fg: #ffffff;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #86efac;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --r: 5px;
      --r-lg: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.12), 0 1px 4px rgba(0, 0, 0, 0.07);
      --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --panel-w: 272px;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      color: var(--text);
    }

    #map {
      background: #e8eaed;
    }

    .leaflet-container {
      -webkit-transform: none !important;
      transform: none !important;
    }

    /* ── Panel shell ─────────────────────────────────────────── */
    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      width: var(--panel-w);
      background: var(--bg);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* ── Panel header ────────────────────────────────────────── */
    #panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px 11px;
      background: var(--accent);
      color: var(--accent-fg);
      flex-shrink: 0;
    }

    #panel-header .header-icon {
      flex-shrink: 0;
      opacity: 0.9;
    }

    #panel-header h1 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    #panel-header p {
      margin: 2px 0 0;
      font-size: 10.5px;
      opacity: 0.72;
      line-height: 1.3;
    }

    /* ── Sections & dividers ─────────────────────────────────── */
    .panel-section {
      padding: 11px 14px;
    }

    .panel-section:last-child {
      padding-bottom: 14px;
    }

    .panel-divider {
      height: 1px;
      background: var(--border);
    }

    .section-label {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 9px;
    }

    /* ── Zoom controls ───────────────────────────────────────── */
    .zoom-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #zoomRange {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    #zoomRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--accent);
      cursor: pointer;
      transition: transform 100ms var(--ease);
    }

    #zoomRange::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    #zoomRange::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--accent);
      cursor: pointer;
    }

    #zoomValue {
      width: 50px;
      padding: 5px 6px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 12px;
      font-family: var(--font);
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 100ms var(--ease), box-shadow 100ms var(--ease);
      background: var(--bg);
    }

    #zoomValue:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.35);
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: var(--r);
      border: 1px solid transparent;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: background 120ms var(--ease), color 120ms var(--ease),
        border-color 120ms var(--ease), box-shadow 120ms var(--ease);
    }

    .btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-primary:active {
      background: #1e3a8a;
    }

    .btn-secondary {
      background: var(--bg-muted);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }

    .btn-ghost:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    /* draw active → cancel style */
    body.is-drawing #drawBtn {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-group .btn {
      flex: 1;
    }

    /* ── Stats ───────────────────────────────────────────────── */
    .stat-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 3px 0;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 50px;
      flex-shrink: 0;
    }

    .stat-value {
      font-size: 12px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      word-break: break-all;
      line-height: 1.4;
    }

    .stat-unit {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Status message ──────────────────────────────────────── */
    #message {
      display: none;
      margin: 0 14px 12px;
      padding: 7px 10px;
      border-radius: var(--r);
      font-size: 11px;
      line-height: 1.5;
      border: 1px solid var(--info-border);
      background: var(--info-bg);
      color: var(--accent);
      word-break: break-word;
    }

    #message:not(:empty) {
      display: block;
    }

    /* ── Neighbourhood info ──────────────────────────────────── */
    #neighProps {
      margin: 4px 0 0;
      white-space: pre-wrap;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font);
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.55;
    }

    /* ── In-map overlays ─────────────────────────────────────── */
    .density-label {
      background: rgba(255, 255, 255, 0.93) !important;
      color: var(--text) !important;
      padding: 2px 5px !important;
      border-radius: 4px !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18) !important;
      pointer-events: none !important;
      border: 1px solid var(--border) !important;
    }

    .line-label div {
      font-family: var(--font) !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 3px 7px !important;
      border-radius: 4px !important;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.28) !important;
      letter-spacing: 0.01em;
    }

    /* Station name labels */
    .station-label {
      background: rgba(255, 255, 255, 0.93) !important;
      border: 1px solid rgba(0, 0, 0, 0.2) !important;
      border-radius: 3px !important;
      padding: 2px 5px !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #1a1a2e !important;
      white-space: nowrap !important;
      pointer-events: none !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15) !important;
    }

    .station-label.leaflet-tooltip-right::before {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <aside id="controls">

    <!-- Header -->
    <div id="panel-header">
      <svg class="header-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2" />
        <path d="M3 11V8a9 9 0 0 1 18 0v3" />
        <circle cx="7.5" cy="16" r="1" />
        <circle cx="16.5" cy="16" r="1" />
        <path d="M7.5 11V8M16.5 11V8" />
      </svg>
      <div>
        <h1>Transport Planner</h1>
        <p>Population-based route analysis</p>
      </div>
    </div>

    <!-- Zoom -->
    <div class="panel-section">
      <span class="section-label">Zoom</span>
      <div class="zoom-row">
        <input id="zoomRange" type="range" min="1" max="19" step="0.01" value="10" />
        <input id="zoomValue" type="text" value="10" />
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- Analysis actions -->
    <div class="panel-section">
      <span class="section-label">Analysis</span>
      <div class="btn-group">
        <button id="drawBtn" class="btn btn-primary">Draw Area</button>
        <button id="suggestBtn" class="btn btn-secondary" disabled>Routes</button>
      </div>
      <div class="btn-group" style="margin-top:6px;">
        <button id="hideSuggestBtn" class="btn btn-ghost" disabled>Hide Routes</button>
        <button id="tubeMapBtn" class="btn btn-ghost" disabled>Tube Map</button>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- Selection stats -->
    <div class="panel-section" id="stats-section">
      <span class="section-label">Selection</span>
      <div class="stat-row">
        <span class="stat-label">Area</span>
        <span class="stat-value" id="areaDisplay">—</span>
        <span class="stat-unit">km²</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Centre</span>
        <span class="stat-value" id="centroid">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Density</span>
        <span class="stat-value" id="density"></span>
      </div>
    </div>

    <!-- Status message -->
    <div id="message"></div>

    <!-- Neighbourhood -->
    <div class="panel-section" id="neighbourhoodInfo">
      <span class="section-label">Neighbourhood</span>
      <pre id="neighProps">—</pre>
    </div>

  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script>
    // Minimal full-screen Leaflet map
    const map = L.map("map", {
      center: [51.5074, -0.1278],
      zoom: 10,
      dragging: true,
      scrollWheelZoom: true,
      touchZoom: true,
      zoomAnimation: false,
      preferCanvas: false,
    });

    const tileLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap",
      },
    ).addTo(map);

    // Controls
    const zoomRange = document.getElementById("zoomRange");
    const zoomValue = document.getElementById("zoomValue");
    const drawBtn = document.getElementById("drawBtn");
    const areaDisplay = document.getElementById("areaDisplay");
    const messageEl = document.getElementById("message");
    const centroidEl = document.getElementById("centroid");
    const densityEl = document.getElementById("density");
    const neighPropsEl = document.getElementById("neighProps");

    // Grid overlay: layer and cached data
    const gridLayer = L.layerGroup().addTo(map);
    // Suggestions overlay: stations and proposed lines
    const suggestionsLayer = L.layerGroup().addTo(map);
    let gridData = null;

    async function loadGridCsv() {
      if (gridData !== null) return gridData;
      try {
        const resp = await fetch("/gbr_pd_2020_1km_ASCII_XYZ.csv");
        if (!resp.ok) throw new Error("Failed to load CSV");
        const text = await resp.text();
        const lines = text.split(/\r?\n/);
        const out = [];
        for (let i = 1; i < lines.length; i++) {
          const l = lines[i].trim();
          if (!l) continue;
          const parts = l.split(",");
          if (parts.length < 3) continue;
          const x = parseFloat(parts[0]);
          const y = parseFloat(parts[1]);
          const z = parseFloat(parts[2]);
          if (isNaN(x) || isNaN(y) || isNaN(z)) continue;
          out.push({ lon: x, lat: y, value: z });
        }
        gridData = out;
        return gridData;
      } catch (err) {
        console.error("loadGridCsv error", err);
        gridData = [];
        return gridData;
      }
    }

    function styleForValue(v) {
      // simple color ramp
      if (v <= 1)
        return {
          color: "#1a9850",
          fillColor: "#a6d96a",
          fillOpacity: 0.6,
          weight: 1,
        };
      if (v <= 5)
        return {
          color: "#66bd63",
          fillColor: "#66bd63",
          fillOpacity: 0.6,
          weight: 1,
        };
      if (v <= 20)
        return {
          color: "#fdae61",
          fillColor: "#fdae61",
          fillOpacity: 0.6,
          weight: 1,
        };
      return {
        color: "#d73027",
        fillColor: "#d73027",
        fillOpacity: 0.6,
        weight: 1,
      };
    }

    function radiusForValue(v) {
      // map value to circle radius (meters) - reduced scale and capped
      const base = 10; // smaller minimum radius
      const r = base + v * 6; // much smaller multiplier than before
      return Math.max(5, Math.min(500, r));
    }

    function radiusForValueRelative(v, minV, maxV) {
      const minR = 6; // meters
      const maxR = 200; // meters (relative cap)
      if (!isFinite(v)) return minR;
      if (!isFinite(minV) || !isFinite(maxV) || maxV === minV) {
        // fallback to small absolute radius
        return Math.max(5, Math.min(200, 6 + v * 6));
      }
      const t = (v - minV) / (maxV - minV);
      return minR + t * (maxR - minR);
    }

    // Initialize range and text
    zoomRange.value = map.getZoom();
    zoomValue.value = map.getZoom();

    // Update map when slider changes (allow fractional zoom)
    zoomRange.addEventListener("input", function () {
      const z = parseFloat(this.value);
      map.setZoom(z);
      zoomValue.value = z.toFixed(2);
    });

    // Update map when text input changes
    zoomValue.addEventListener("change", function () {
      const v = parseFloat(this.value);
      if (!isNaN(v)) {
        const clamped = Math.max(1, Math.min(19, v));
        map.setZoom(clamped);
        zoomRange.value = clamped;
        this.value = clamped.toFixed(2);
      } else {
        this.value = map.getZoom().toFixed(2);
      }
    });

    // Sync slider when user uses map zoom controls (mouse wheel or +/-)
    map.on("zoom", function () {
      const z = map.getZoom();
      zoomRange.value = z;
      zoomValue.value = z.toFixed(2);
    });

    // Drawing via Leaflet.draw
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      draw: {
        polygon: true,
        polyline: false,
        rectangle: true,
        circle: false,
        marker: false,
        circlemarker: false,
      },
      edit: {
        featureGroup: drawnItems,
        edit: true,
        remove: true,
      },
    });

    let drawMode = false;
    let activeDrawer = null;

    function enableDraw() {
      messageEl.textContent = "";
      drawMode = true;
      drawBtn.textContent = "Cancel Draw";
      document.body.classList.add('is-drawing');
      try { map.dragging.disable(); } catch (e) { }
      try { map.scrollWheelZoom.disable(); } catch (e) { }
      try { map.touchZoom.disable(); } catch (e) { }
      activeDrawer = new L.Draw.Polygon(map, drawControl.options.draw.polygon ? {} : {});
      activeDrawer.enable();
    }

    function disableDraw() {
      drawMode = false;
      drawBtn.textContent = "Draw Area";
      document.body.classList.remove('is-drawing');
      try { map.dragging.enable(); } catch (e) { }
      try { map.scrollWheelZoom.enable(); } catch (e) { }
      try { map.touchZoom.enable(); } catch (e) { }
      if (activeDrawer) {
        try { activeDrawer.disable(); } catch (e) { }
        activeDrawer = null;
      }
    }

    drawBtn.addEventListener("click", function () {
      if (!drawMode) enableDraw();
      else disableDraw();
    });

    // Wire suggestion buttons
    try {
      suggestBtn.addEventListener("click", function () {
        try {
          showSuggestions();
        } catch (e) {
          console.error("showSuggestions click failed", e);
          messageEl.textContent = "Suggestions error";
        }
      });
      hideSuggestBtn.addEventListener("click", function () {
        try {
          clearSuggestions();
        } catch (e) {
          console.error("clearSuggestions click failed", e);
        }
      });
      document
        .getElementById("tubeMapBtn")
        .addEventListener("click", function () {
          try {
            generateTubeMap(window._lastLineData);
          } catch (e) {
            console.error("tubeMapBtn click failed", e);
            messageEl.textContent = "Tube map generation error";
          }
        });
    } catch (e) {
      console.warn("Failed to bind suggestion buttons", e);
    }

    function clearExisting() {
      drawnItems.clearLayers();
      try {
        gridLayer.clearLayers();
      } catch (e) { }
      try {
        suggestionsLayer.clearLayers();
      } catch (e) { }
      areaDisplay.textContent = "—";
      messageEl.textContent = "";
      centroidEl.textContent = "—";
      densityEl.textContent = "";
      neighPropsEl.textContent = "—";
    }

    const AREA_CAP_KM2 = 84000.0;

    function computeCentroidCoords(geojson) {
      try {
        const c = turf.centroid(geojson);
        if (c && c.geometry && c.geometry.coordinates) {
          const lon = c.geometry.coordinates[0];
          const lat = c.geometry.coordinates[1];
          return [lat, lon];
        }
      } catch (err) {
        console.error("centroid error", err);
      }
      return null;
    }

    // Neighbourhood repository lookup disabled to avoid external camaraproject requests.
    async function findNeighbourhoodData(lat, lon) {
      messageEl.textContent = "Neighbourhood repository lookup disabled";
      neighPropsEl.textContent = "disabled";
      return null;
    }

    map.on(L.Draw.Event.CREATED, async function (e) {
      const layer = e.layer;
      try {
        const geojson = layer.toGeoJSON();
        const areaSqMeters = turf.area(geojson);
        const areaKm2 = areaSqMeters / 1e6;
        if (areaKm2 > AREA_CAP_KM2) {
          messageEl.textContent = `Invalid: selected area ${areaKm2.toFixed(2)} km² exceeds limit of ${AREA_CAP_KM2.toLocaleString()} km²`;
          try {
            layer.remove();
          } catch (e) { }
          return;
        }

        clearExisting();
        drawnItems.addLayer(layer);
        areaDisplay.textContent = areaKm2.toFixed(4);

        const centroid = computeCentroidCoords(geojson);
        if (centroid) {
          const lat = centroid[0];
          const lon = centroid[1];
          centroidEl.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
          // First: check our CSV density grid via local server endpoint
          messageEl.textContent = "Checking density grid...";
          try {
            const resp = await fetch(
              `/density?lon=${encodeURIComponent(lon)}&lat=${encodeURIComponent(lat)}&max_m=1000`,
            );
            if (resp.ok) {
              const json = await resp.json();
              densityEl.textContent = `Density: ${Number(json.value).toLocaleString()} (nearest ${Number(json.distance_m).toFixed(1)} m)`;
              messageEl.textContent = "";
              try {
                L.popup({ maxWidth: 300 })
                  .setLatLng([json.lat, json.lon])
                  .setContent(
                    `<strong>Population density</strong><br/>${Number(json.value).toLocaleString()}<br/><small>distance ${Number(json.distance_m).toFixed(1)} m</small>`,
                  )
                  .openOn(map);
              } catch (e) {
                console.warn("popup failed", e);
              }
            } else if (resp.status === 404) {
              const txt = await resp.text();
              messageEl.textContent = txt || "No grid cell within 1000 m";
              densityEl.textContent = "Density: not found within 1 km";
            } else {
              const txt = await resp.text();
              messageEl.textContent = `Density lookup failed: ${txt}`;
            }
          } catch (err) {
            console.error("density lookup error", err);
            messageEl.textContent = "Density lookup error";
          }

          // Draw grid cells from CSV that intersect the drawn polygon
          messageEl.textContent =
            messageEl.textContent || "Finding intersecting grid cells...";
          try {
            const csv = await loadGridCsv();
            try {
              gridLayer.clearLayers();
            } catch (e) { }
            let count = 0;
            const poly = geojson; // drawn polygon GeoJSON
            const matches = [];
            for (const g of csv) {
              try {
                const pt = turf.point([g.lon, g.lat]);
                if (turf.booleanPointInPolygon(pt, poly)) {
                  matches.push(g);
                }
              } catch (e) {
                continue;
              }
            }
            if (matches.length > 0) {
              const vals = matches
                .map((m) => m.value)
                .filter((v) => isFinite(v));
              const minV = vals.length ? Math.min(...vals) : NaN;
              const maxV = vals.length ? Math.max(...vals) : NaN;
              for (const g of matches) {
                try {
                  const st = styleForValue(g.value);
                  const radius = radiusForValueRelative(g.value, minV, maxV);
                  const c = L.circle([g.lat, g.lon], {
                    radius: radius,
                    color: st.color,
                    fillColor: st.fillColor,
                    fillOpacity: st.fillOpacity,
                    weight: 1,
                  }).addTo(gridLayer);
                  c.bindPopup(
                    `Value: ${Number(g.value)}\n${g.lon.toFixed(6)}, ${g.lat.toFixed(6)}\nRadius: ${Math.round(radius)} m`,
                  );
                  try {
                    c.bindTooltip(`${Number(g.value)}`, {
                      permanent: true,
                      direction: "center",
                      className: "density-label",
                      interactive: false,
                    });
                  } catch (e) { }
                  count += 1;
                } catch (e) {
                  continue;
                }
              }
            }
            messageEl.textContent =
              count > 0
                ? `Found ${count} grid cells intersecting selection`
                : "No grid cells intersect selection";

            // Store matches and enable the Suggestions button; user triggers suggestions manually
            try {
              window._lastMatches = matches.slice();
              if (matches.length > 0) {
                suggestBtn.disabled = false;
                hideSuggestBtn.disabled = true;
                messageEl.textContent = `Found ${matches.length} grid points inside selection — click Suggestions to request routes`;
              } else {
                suggestBtn.disabled = true;
                hideSuggestBtn.disabled = true;
              }
            } catch (e) {
              console.warn("store matches failed", e);
            }
          } catch (err) {
            console.error("grid overlay error", err);
            messageEl.textContent = "Grid overlay error";
          }
        }

        disableDraw();
        drawBtn.disabled = true;
        messageEl.textContent = "";
      } catch (err) {
        console.error("Area calculation failed", err);
        messageEl.textContent = "Area calculation failed";
      }
    });

    // Suggestions: show/hide handlers
    function clearSuggestions() {
      try {
        suggestionsLayer.clearLayers();
      } catch (e) { }
      // show population density grid again
      try {
        if (!map.hasLayer(gridLayer)) map.addLayer(gridLayer);
      } catch (e) { }
      hideSuggestBtn.disabled = true;
      suggestBtn.disabled =
        window._lastMatches && window._lastMatches.length ? false : true;
      document.getElementById("tubeMapBtn").disabled = true;
      messageEl.textContent = "";
    }

    function showSuggestions() {
      try {
        const matches = (window._lastMatches || []).slice();
        if (!matches || matches.length === 0) {
          messageEl.textContent = "No matches available for suggestions";
          return;
        }

        suggestionsLayer.clearLayers();
        // hide the population density grid layer while showing suggestions
        try {
          if (map.hasLayer(gridLayer)) map.removeLayer(gridLayer);
        } catch (e) { }

        // POST matches to /suggestions endpoint
        const csvBody = matches
          .map((m) => `${m.lon},${m.lat},${m.value}`)
          .join("\n");
        fetch("/suggestions", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: csvBody,
        })
          .then((resp) => {
            if (!resp.ok)
              throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            return resp.json();
          })
          .then((data) => {
            const lineColors = [
              "#2b83ba",
              "#fdae61",
              "#66bd63",
              "#7b3294",
              "#d73027",
              "#1f78b4",
              "#e31a1c",
            ];

            // Line type colors (overrides default)
            const lineTypeColors = {
              RADIAL_TRUNK: "#d62728", // red
              CORE_DISTRIBUTOR: "#ff7f0e", // orange
              ORBITAL: "#2ca02c", // green
              NOT_METRO: "#cccccc", // gray (unlikely)
            };

            const created = {};
            const allLineBounds = [];
            const transfers = new Set();

            // First pass: collect all stations and detect intersections
            const allStations = new Map();
            data.lines.forEach((line, li) => {
              line.stations.forEach((st) => {
                const key = `${st.lon},${st.lat}`;
                if (!allStations.has(key))
                  allStations.set(key, { ...st, lines: [] });
                allStations.get(key).lines.push(li);
              });
            });
            allStations.forEach((st) => {
              if (st.lines.length > 1) transfers.add(`${st.lon},${st.lat}`);
            });

            // Render lines and stations
            data.lines.forEach((line, li) => {
              const lineType = line.type || "RADIAL_TRUNK";
              const isLoop = line.isLoop || false;
              const color =
                lineTypeColors[lineType] ||
                lineColors[li % lineColors.length];
              const latlngs = line.stations.map((st) => [st.lat, st.lon]);

              // Use dashed style for loops
              const polylineStyle = isLoop
                ? {
                  color: color,
                  weight: 3,
                  opacity: 0.95,
                  dashArray: "5, 5",
                }
                : { color: color, weight: 3, opacity: 0.95 };

              const poly = L.polyline(latlngs, polylineStyle).addTo(
                suggestionsLayer,
              );

              // Add label with line type and ID on the polyline
              const midIdx = Math.floor(latlngs.length / 2);
              if (midIdx < latlngs.length) {
                const midPoint = latlngs[midIdx];
                const loopMarker = isLoop ? " ⭕" : "";
                const tph = line.trains_per_hour || 0;
                const tphLabel = tph > 0 ? ` · ${tph}/hr` : "";
                L.marker(midPoint, {
                  icon: L.divIcon({
                    className: "line-label",
                    html: `<div style="background:${color};color:#fff;padding:2px 6px;border-radius:3px;font-weight:bold;font-size:12px;">${line.id}${loopMarker}${tphLabel}</div>`,
                  }),
                }).addTo(suggestionsLayer);
              }

              allLineBounds.push(poly.getBounds());

              line.stations.forEach((st, si) => {
                const key = `${st.lon},${st.lat}`;
                if (created[key]) return;
                const isTransfer = transfers.has(key);
                const radius = isTransfer
                  ? 10
                  : Math.max(6, Math.min(18, (st.value || 0) / 100));
                const m = L.circleMarker([st.lat, st.lon], {
                  radius: radius,
                  color: isTransfer ? "#c62828" : color,
                  fillColor: isTransfer ? "#c62828" : color,
                  fillOpacity: 0.95,
                  weight: 1,
                }).addTo(suggestionsLayer);
                const loopInfo = isLoop ? " [loop line]" : "";
                m.bindPopup(
                  `<strong>Station ${st.id}</strong><br/>Type: ${lineType}${loopInfo}<br/>Value: ${Number(st.value || 0).toLocaleString()}<br/>${st.lon.toFixed(6)}, ${st.lat.toFixed(6)}`,
                );
                m.bindTooltip(`${st.id}`, {
                  permanent: true,
                  direction: "right",
                  className: "station-label",
                  offset: [8, 0],
                });
                created[key] = m;
              });
            });

            // Reverse-geocode each unique station using OSM Nominatim via the local proxy.
            // Names resolve progressively (1.1 s between requests, Nominatim usage policy).
            (async () => {
              async function fetchAreaName(lat, lon) {
                try {
                  const nomUrl = encodeURIComponent(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&zoom=15&format=json&accept-language=en`
                  );
                  const res = await fetch(`/proxy?url=${nomUrl}`);
                  if (!res.ok) return null;
                  const d = await res.json();
                  const a = d.address || {};
                  return (
                    a.neighbourhood || a.suburb || a.quarter ||
                    a.city_district || a.hamlet || a.village ||
                    a.town || a.city || d.name || null
                  );
                } catch (e) {
                  return null;
                }
              }

              for (const [key, st] of allStations) {
                const marker = created[key];
                if (!marker) continue;
                const name = await fetchAreaName(st.lat, st.lon);
                if (name) {
                  marker.setTooltipContent(name);
                  const isTransfer = transfers.has(key);
                  marker.getPopup().setContent(
                    `<strong>${name}</strong><br/>` +
                    `ID: ${st.id}` +
                    `${isTransfer ? '<br/>🔄 Interchange' : ''}<br/>` +
                    `Value: ${Number(st.value || 0).toLocaleString()}<br/>` +
                    `${Number(st.lon).toFixed(6)}, ${Number(st.lat).toFixed(6)}`
                  );
                }
                await new Promise((r) => setTimeout(r, 1100));
              }
            })();

            // Fit map
            if (allLineBounds.length > 0) {
              try {
                const combined = allLineBounds.reduce(
                  (acc, b) => acc.extend(b),
                  allLineBounds[0],
                );
                map.fitBounds(combined, { padding: [20, 20] });
              } catch (e) { }
            }

            suggestBtn.disabled = true;
            hideSuggestBtn.disabled = false;
            const lineSummary = data.lines
              .map((l) => {
                const loopMarker = l.isLoop ? " ⭕" : "";
                const tphText = l.trains_per_hour ? ` ${l.trains_per_hour}tph` : "";
                return `${l.id} (${l.type})${loopMarker}${tphText}`;
              })
              .join(", ");
            messageEl.textContent = `Showing ${data.lines.length} metro lines: ${lineSummary}`;

            // Store line data for tube map generation
            window._lastLineData = data;
            document.getElementById("tubeMapBtn").disabled = false;
          })
          .catch((err) => {
            console.error("Suggestions fetch error", err);
            messageEl.textContent = "Failed to fetch suggestions";
          });
      } catch (err) {
        console.error("showSuggestions error", err);
        messageEl.textContent = "Suggestions error";
      }
    }

    // Ensure the map recalculates size when the page finishes loading
    window.addEventListener("load", function () {
      setTimeout(function () {
        try {
          map.invalidateSize();
        } catch (e) { }
      }, 50);
    });

    // Generate London Underground-style schematic tube map
    function generateTubeMap(lineData) {
      if (!lineData || lineData.lines.length === 0) {
        messageEl.textContent = "No line data available for tube map";
        return;
      }

      const lines = lineData.lines;
      // Assign a distinct color to each line (HSL palette)
      const lineColors = {};
      function colorForIndex(i, total) {
        const hue = Math.round((i * 360) / Math.max(1, total));
        return `hsl(${hue},70%,45%)`;
      }
      lines.forEach((ln, idx) => {
        lineColors[ln.id] = colorForIndex(idx, lines.length);
      });

      // Calculate layout: collect all stations
      const allStations = new Map();
      const lineStationMaps = [];

      lines.forEach((line) => {
        const lineStations = [];
        line.stations.forEach((st) => {
          const key = `${st.lon.toFixed(4)},${st.lat.toFixed(4)}`;
          if (!allStations.has(key)) {
            allStations.set(key, {
              id: st.id,
              lon: st.lon,
              lat: st.lat,
              value: st.value,
              lines: [],
            });
          }
          allStations.get(key).lines.push(line.id);
          lineStations.push(key);
        });
        lineStationMaps.push({ line, stationKeys: lineStations });
      });

      // Compute bounds
      const lons = Array.from(allStations.values()).map((s) => s.lon);
      const lats = Array.from(allStations.values()).map((s) => s.lat);
      const minLon = Math.min(...lons);
      const maxLon = Math.max(...lons);
      const minLat = Math.min(...lats);
      const maxLat = Math.max(...lats);

      // Map geographic coords to schematic layout
      const margin = 60;
      const svgWidth = 1200;
      const svgHeight = 900;
      const plotWidth = svgWidth - 2 * margin;
      const plotHeight = svgHeight - 2 * margin;

      const lonRange = maxLon - minLon || 1;
      const latRange = maxLat - minLat || 1;

      const stationPositions = new Map();
      allStations.forEach((st, key) => {
        const x = margin + ((st.lon - minLon) / lonRange) * plotWidth;
        const y =
          margin + plotHeight - ((st.lat - minLat) / latRange) * plotHeight; // flip y
        stationPositions.set(key, { x, y, station: st });
      });

      // Generate SVG
      let svg = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Metro Network — Schematic Map</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-page: #f0f2f5;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --r: 6px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      background: var(--bg-page);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    header p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .map-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: 0 4px 20px rgba(0,0,0,0.09);
      overflow: hidden;
      display: inline-block;
    }
    svg { display: block; }
    .line {
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .station {
      fill: white;
      stroke-width: 2.5;
    }
    .station-label {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
      fill: var(--text);
    }
    .legend-section {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 5px 10px;
      font-size: 12px;
    }
    .legend-swatch {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-name { font-weight: 600; color: var(--text); }
    .legend-tph  { color: var(--text-muted); }
    .type-legend {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .type-legend b { color: var(--text); }
    .note {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 680px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Metro Network — Schematic Map</h1>
    <p>Algorithmically generated from population density</p>
  </header>
  <div class="map-wrap">
  <svg width="${svgWidth}" height="${svgHeight}">`;

      // Draw lines (each line gets a distinct color)
      lineStationMaps.forEach((lineMap, idx) => {
        const color = lineColors[lineMap.line.id] || "#999";
        const lineId = lineMap.line.id;
        const label = `${lineMap.line.id} (${lineMap.line.type})`;

        // Draw path connecting stations in order
        let pathD = "";
        for (let i = 0; i < lineMap.stationKeys.length; i++) {
          const key = lineMap.stationKeys[i];
          const pos = stationPositions.get(key);
          if (pos) {
            if (i === 0) {
              pathD += `M${pos.x},${pos.y}`;
            } else {
              pathD += `L${pos.x},${pos.y}`;
            }
          }
        }

        svg += `<path class="line" d="${pathD}" stroke="${color}" opacity="0.8" />`;

        // Draw trains-per-hour badge at the mid-station of each line
        const tphMidKey = lineMap.stationKeys[Math.floor(lineMap.stationKeys.length / 2)];
        const tphMidPos = stationPositions.get(tphMidKey);
        if (tphMidPos && lineMap.line.trains_per_hour > 0) {
          const tphVal = lineMap.line.trains_per_hour;
          const bx = tphMidPos.x;
          const by = tphMidPos.y + 14;
          svg += `<rect x="${bx - 24}" y="${by - 10}" width="48" height="16" rx="5" fill="${color}" opacity="0.88"/>`;
          svg += `<text x="${bx}" y="${by + 3}" font-size="9" font-weight="bold" fill="white" text-anchor="middle">${tphVal} tph</text>`;
        }
      });

      // Draw stations (order matters: draw on top)
      const stationList = Array.from(stationPositions.entries());
      stationList.forEach(([key, pos]) => {
        const isTransfer = pos.station.lines.length > 1;
        const radius = isTransfer ? 6 : 4;
        const strokeColor = isTransfer ? "#c62828" : "#333";
        svg += `<circle class="station" cx="${pos.x}" cy="${pos.y}" r="${radius}" stroke="${strokeColor}" />`;
      });

      // Draw station labels
      stationList.forEach(([key, pos]) => {
        const label = pos.station.id.replace("st_", "");
        svg += `<text class="station-label" x="${pos.x}" y="${pos.y - 14}" fill="#000">${label}</text>`;
      });

      // Add SVG in-map legend (per-line, top-left)
      svg += `<g>`;
      let legendY = 22;
      lineStationMaps.forEach((lm, i) => {
        const color = lineColors[lm.line.id] || "#999";
        const tph = lm.line.trains_per_hour || 0;
        const tphStr = tph > 0 ? ` — ${tph} tph` : "";
        const labelTxt = `${lm.line.id} (${lm.line.type})${tphStr}`;
        svg += `<line x1="14" y1="${legendY}" x2="36" y2="${legendY}" stroke="${color}" stroke-width="3" />`;
        svg += `<text x="42" y="${legendY + 4}" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#0f172a">${labelTxt}</text>`;
        legendY += 18;
      });
      svg += `</g>`;

      svg += `</svg></div>`;

      // Per-line card legend below the map
      svg += `<div class="legend-section">`;
      lineStationMaps.forEach((lm) => {
        const color = lineColors[lm.line.id] || "#999";
        const tph = lm.line.trains_per_hour || 0;
        svg += `<div class="legend-item">`;
        svg += `<span class="legend-swatch" style="background:${color};"></span>`;
        svg += `<span class="legend-name">${lm.line.id}</span>`;
        svg += `<span style="color:#64748b;font-size:11px;">${lm.line.type.replace('_', ' ')}</span>`;
        if (tph > 0) svg += `<span class="legend-tph">&middot; ${tph}&thinsp;tph</span>`;
        svg += `</div>`;
      });
      svg += `</div>`;

      svg += `<div class="type-legend">`;
      svg += `<span><b style="color:#d62728">—</b> Radial Trunk</span>`;
      svg += `<span><b style="color:#ff7f0e">—</b> Core Distributor</span>`;
      svg += `<span><b style="color:#2ca02c">—</b> Orbital</span>`;
      svg += `<span>● Transfer station &nbsp;○ End station</span>`;
      svg += `</div>`;

      svg += `<p class="note"><strong>Note:</strong> Schematic diagram — geographic positions simplified for clarity.
    Larger circles = transfer stations. <strong>tph</strong> values are demand-weighted suggestions (4–30 tph,
    snapped to even headways).</p>`;
      svg += `</body></html>`;

      // Open in new tab
      const blob = new Blob([svg], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }
  </script>
</body>

</html>
